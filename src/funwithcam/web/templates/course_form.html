{% extends "app_shell.html" %}
{% block title %}添加固定课程 · FunWithCam{% endblock %}
{% block app_content %}
<header class="form-page-heading">
  <a class="back-link" href="/schedule?tab=courses">← 返回固定课程</a>
  <h1>添加固定课程</h1>
  <p>启用后，课程会按星期自动出现在当天简报中。</p>
</header>

{% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}

<form method="post" action="/courses" class="form-panel form-grid">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="span-2">
    <span>课程名称</span>
    <input name="name" required autofocus placeholder="例如：英语课">
  </label>
  <label>
    <span>星期</span>
    <select name="weekday">
      <option value="1">星期一</option>
      <option value="2">星期二</option>
      <option value="3">星期三</option>
      <option value="4">星期四</option>
      <option value="5">星期五</option>
      <option value="6">星期六</option>
      <option value="7">星期日</option>
    </select>
  </label>
  <label>
    <span>开始时间</span>
    <input type="time" name="start_time" required>
  </label>
  <label>
    <span>上课方式</span>
    <select name="delivery_type">
      <option value="online">线上</option>
      <option value="offline">线下</option>
    </select>
  </label>
  <label>
    <span>提前准备（分钟）</span>
    <input type="number" name="preparation_minutes" min="0" value="10" inputmode="numeric">
  </label>
  <label>
    <span>交通时间（分钟）</span>
    <input type="number" name="travel_minutes" min="0" value="0" inputmode="numeric">
  </label>
  <div class="form-actions span-2">
    <a class="button" href="/schedule?tab=courses">取消</a>
    <button class="button button-primary" type="submit">保存固定课程</button>
  </div>
</form>
{% endblock %}
