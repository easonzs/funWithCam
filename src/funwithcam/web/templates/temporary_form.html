{% extends "app_shell.html" %}
{% block title %}添加临时安排 · FunWithCam{% endblock %}
{% block app_content %}
<header class="form-page-heading">
  <a class="back-link" href="/schedule?tab=temporary">← 返回临时安排</a>
  <h1>添加临时安排</h1>
  <p>一次性事项，可指定任意一天生效，例如开家长会、体检预约。</p>
</header>

{% if error %}<p class="notice notice-error" role="alert">{{ error }}</p>{% endif %}

<form method="post" action="/schedule/temporary" class="form-panel form-grid">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="span-2">
    <span>名称</span>
    <input name="title" required autofocus placeholder="例如：开家长会">
  </label>
  <label>
    <span>生效日期</span>
    <input type="date" name="target_date" value="{{ today.isoformat() }}" required>
  </label>
  <label>
    <span>开始时间（可选）</span>
    <input type="time" name="scheduled_time">
  </label>
  <label>
    <span>预计时长（分钟，可选）</span>
    <input type="number" name="estimated_minutes" min="1" inputmode="numeric">
  </label>
  <label>
    <span>提前准备（分钟）</span>
    <input type="number" name="preparation_minutes" min="0" value="0" inputmode="numeric">
  </label>
  <label class="span-2">
    <span>备注（可选）</span>
    <textarea name="notes" rows="3" placeholder="需要携带的物品或补充说明"></textarea>
  </label>
  <div class="form-actions span-2">
    <a class="button" href="/schedule?tab=temporary">取消</a>
    <button class="button button-primary" type="submit">保存临时安排</button>
  </div>
</form>
{% endblock %}
