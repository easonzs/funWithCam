timezone: Asia/Shanghai

video:
  # 应用只读取 go2rtc 的本地输出，不直接保存摄像头密码。
  stream_url: rtsp://127.0.0.1:8554/study_room
  inference_fps: 4
  reconnect_seconds: 3
  max_frame_age_seconds: 2
  warmup_seconds: 1.5

study_area:
  # x_min, y_min, x_max, y_max，均为归一化坐标。
  rect: [0.20, 0.15, 0.80, 0.95]

person:
  min_detection_confidence: 0.60
  min_bbox_area_ratio: 0.03
  max_bbox_area_ratio: 0.65

presence:
  confirm_seconds: 5
  allowed_missed_seconds: 1
  max_center_jump: 0.20

precheck:
  # 点击或说出“开始/继续学习”后，连续检查书桌区域。
  duration_seconds: 5
  timeout_seconds: 15
  min_valid_frame_ratio: 0.80
  # 0～255，取书桌区域的平均亮度。
  min_brightness: 45

calibration:
  # 家长在 Web 中分四步录入孩子自己的正常动作和合适光线。
  duration_seconds: 10
  timeout_seconds: 25
  min_valid_samples: 12
  # 原图和标注图只保存在本机 data 目录，不会提交到 Git。
  image_dir: data/calibrations

audio:
  # macbook 使用本机 say；camera 通过 go2rtc 的双向音频从摄像头播放。
  output_source: macbook
  command: ["say", "{text}"]
  camera_test_text: "摄像头人物检测和语音播放测试成功。"
  camera_api_url: http://127.0.0.1:1984
  camera_stream: study_room
  camera_audio_dir: data/audio
  camera_go2rtc_audio_dir: data/audio

speech:
  enabled: false
  # macbook 使用 sounddevice，camera 使用 go2rtc RTSP 音频。
  input_source: macbook
  model_path: models/sherpa-onnx-streaming-zipformer-zh-14M-2023-02-23
  sample_rate: 48000
  block_size: 8000
  device:
  command_cooldown_seconds: 2

identity:
  detector_model: models/face_detection_yunet_2023mar.onnx
  recognizer_model: models/face_recognition_sface_2021dec.onnx
  detection_threshold: 0.85
  nms_threshold: 0.30
  min_face_size_px: 80
  match_threshold: 0.45
  ambiguity_margin: 0.08
  confirmation_frames: 3
  confirmation_window_seconds: 3
  enrollment_samples: 9
  sample_interval_seconds: 0.7
  command_timeout_seconds: 60
  # 开启后会保存包含人脸的调试照片，仅建议排查识别问题时使用。
  save_debug_frames: false
  debug_dir: data/face_debug
  debug_face_limit: 30
  debug_rejected_limit: 10

web:
  host: 0.0.0.0
  port: 8000
  session_hours: 24

logging:
  level: INFO

